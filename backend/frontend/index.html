<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CropSense Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <header>
        <h1>🌱 CropSense Dashboard</h1>
        <p>Smart Soil Moisture Monitoring</p>
    </header>

    <div class="cards">

        <div class="card">
            <h3>Soil Moisture</h3>
            <h1 id="moisture">0%</h1>
        </div>

        <div class="card">
            <h3>Status</h3>
            <h2 id="status">Loading...</h2>
        </div>

        <div class="card">
            <h3>Last Updated</h3>
            <h2 id="time">--:--:--</h2>
        </div>

    </div>

    <div class="progressBox">
        <div class="progress">
            <div id="bar"></div>
        </div>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
